<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a41">Smart Dustbin: Wiring Diagram</text>

  <!-- lines -->
  <g stroke="#5b6b82" stroke-width="2.5" fill="none">
    <line x1="290" y1="135" x2="390" y2="230"/>
    <line x1="290" y1="345" x2="390" y2="320"/>
    <line x1="570" y1="250" x2="670" y2="250"/>
    <line x1="560" y1="200" x2="670" y2="115"/>
    <line x1="480" y1="360" x2="480" y2="420"/>
  </g>

  <!-- NodeMCU -->
  <rect x="390" y="190" width="180" height="170" rx="12" fill="#0b5ed7"/>
  <text x="480" y="255" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">NodeMCU</text>
  <text x="480" y="280" text-anchor="middle" font-size="16" fill="#ffffff">ESP8266</text>
  <text x="480" y="308" text-anchor="middle" font-size="13" fill="#dbe7ff">WiFi + Blynk</text>
  <text x="480" y="328" text-anchor="middle" font-size="13" fill="#dbe7ff">Common GND</text>

  <!-- Ultrasonic -->
  <rect x="40" y="70" width="250" height="135" rx="10" fill="#e8f1ff" stroke="#0b5ed7" stroke-width="2"/>
  <text x="165" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a41">HC-SR04 Ultrasonic Sensor</text>
  <text x="165" y="124" text-anchor="middle" font-size="13" fill="#1b2a41">TRIG → D5</text>
  <text x="165" y="146" text-anchor="middle" font-size="13" fill="#1b2a41">ECHO → D6 (through 1k/2k divider)</text>
  <text x="165" y="168" text-anchor="middle" font-size="13" fill="#1b2a41">VCC → VIN (5V)</text>
  <text x="165" y="190" text-anchor="middle" font-size="13" fill="#1b2a41">GND → GND</text>

  <!-- IR -->
  <rect x="40" y="290" width="250" height="115" rx="10" fill="#fff4e0" stroke="#d98200" stroke-width="2"/>
  <text x="165" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a41">IR Sensor (inside the bin)</text>
  <text x="165" y="344" text-anchor="middle" font-size="13" fill="#1b2a41">OUT → D2</text>
  <text x="165" y="366" text-anchor="middle" font-size="13" fill="#1b2a41">VCC → 3V3</text>
  <text x="165" y="388" text-anchor="middle" font-size="13" fill="#1b2a41">GND → GND</text>

  <!-- Servo -->
  <rect x="670" y="190" width="250" height="120" rx="10" fill="#fdeaea" stroke="#c62828" stroke-width="2"/>
  <text x="795" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a41">Servo Motor (lid)</text>
  <text x="795" y="244" text-anchor="middle" font-size="13" fill="#1b2a41">Signal → D7</text>
  <text x="795" y="266" text-anchor="middle" font-size="13" fill="#1b2a41">VCC → 5V</text>
  <text x="795" y="288" text-anchor="middle" font-size="13" fill="#1b2a41">GND → GND</text>

  <!-- Blynk -->
  <rect x="670" y="60" width="250" height="90" rx="10" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="795" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a41">Blynk Cloud → Phone</text>
  <text x="795" y="118" text-anchor="middle" font-size="13" fill="#1b2a41">Notification: "Dustbin is full"</text>

  <!-- Power -->
  <rect x="390" y="420" width="180" height="70" rx="10" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="480" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a41">5V Supply</text>
  <text x="480" y="472" text-anchor="middle" font-size="13" fill="#1b2a41">USB or VIN + GND</text>

  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#5b6b82">Connect all GND together. The ECHO pin needs the 1k/2k voltage divider (5V output, 3.3V board).</text>
</svg>
